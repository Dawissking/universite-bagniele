name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installation des dependances
        working-directory: tools
        run: npm install

      - name: Generation des pages
        working-directory: tools
        run: npm run build

      - name: Controles qualite
        working-directory: tools
        run: npm run check

      - name: Publication sur la branche deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude '.vscode' \
            --exclude 'tools' \
            --exclude 'site' \
            --exclude 'README.md' \
            --exclude 'ubd-site.zip' \
            ./ site/
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd site
          git init -q -b deploy
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          if git commit -q -m "Deploy ${GITHUB_SHA}"; then
            git push -q --force origin deploy
          else
            echo "Aucun changement a publier."
          fi
